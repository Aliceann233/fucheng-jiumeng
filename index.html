</style></head><body><div id="ripple-layer"></div><div class="site"><div class="topbar"><span>✧ FUCHENG AQUARIUM · EST. 2004</span><button id="sound" aria-label="切换声音">♫ 音效：开</button></div><div class="banner"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div><div class="body"><div class="stamp">✧ A MEMORY UNDER THE WATER ✧</div><h1 class="title">芙城旧梦</h1><div class="sub">有些记忆，沉在水里太久了。</div><div class="ornament">◌ ✦ ◌</div><div class="window"><div class="winhead"><span id="winname">WELCOME · 旧日水族馆</span><div class="lights"><i></i><i></i><i></i></div></div><div class="content" id="scene"></div></div><div class="links"><button id="restart">重新开始</button><button id="help">关于此梦</button></div><div class="foot">© FUCHENG · THE WATER REMEMBERS · VISUAL PROTOTYPE 0.5</div></div></div><script>
(()=>{'use strict';const scene=document.querySelector('#scene'),win=document.querySelector('#winname');const key='fc_dream_v04';let stage=localStorage.getItem(key)||'home',sound=true,audio=null,unlocked=localStorage.getItem(key+'_unlock')==='yes';function button(text,action,cls='mainbtn'){return `<button class="${cls}" data-act="${action}">${text}</button>`}function go(s){stage=s;localStorage.setItem(key,s);render()}function render(){document.querySelector('.site').classList.toggle('inside',stage!=='home');const screens={home:['WELCOME · 旧日水族馆',`<div style="text-align:center"><p>欢迎来到芙城。</p><p class="muted">这里的夏天，似乎从未结束。</p>${button('◌ 轻触水面 · 开始','hospital')}<p class="muted" style="font-size:11px;margin-top:14px">建议佩戴耳机 · 点击时会有水纹</p></div>`],hospital:['VISITOR · 走廊',`<p>走廊很安静。白色的灯光在地砖上晕开。</p><p>你叫<strong>陈屿</strong>。今天，你是来探望<strong>洛嫣</strong>的。</p><p>桌上放着一张旧照片。你总觉得自己曾经见过它。</p><div class="photo" data-act="photo">◌ 点击翻看照片</div><div style="text-align:center">${button('继续向前','sink','smallbtn')}</div>`],photo:['PHOTO · 旧照片',`<p>照片背面有些字迹已经被水晕开。</p><p>你只辨认出一串数字：<strong>044</strong>。</p><p class="muted">角落里似乎还有一个名字……但你看不清。</p><div style="text-align:center">${button('放回照片','hospital','smallbtn')} ${button('走向洗手池','sink','smallbtn')}</div>`],sink:['REFLECTION · 水面',`<p>洗手池的水龙头明明没有打开。</p><p>可水面正在轻轻颤动。</p><div class="water" data-act="aquarium">◌ 触碰水面</div><p class="muted" style="text-align:center">远处的广播声，慢慢变成了水声。</p>`],aquarium:['FUCHENG AQUARIUM · 旧馆',`<p>再睁开眼睛时，医院的走廊不见了。</p><p>你站在一座空荡荡的水族馆里。褪色的导览牌上写着：<strong>欢迎回来</strong>。</p><p>一扇写着「中控室」的门虚掩着。</p><div style="text-align:center">${button('进入中控室','terminal')}</div>`],terminal:['CONTROL PANEL · 044',`<p>一台旧电脑正在运行。蓝色屏幕上浮现着水族馆的档案目录。</p><p class="muted">身份验证 · 请输入四位访问代码</p><div class="row"><input id="pass" maxlength="4" inputmode="numeric" placeholder="访问代码" aria-label="访问代码">${button('确认','unlock','smallbtn')}</div><p id="error" style="color:#c47c88"></p>${unlocked?`<div style="text-align:center">${button('查看档案','archive','smallbtn')}</div>`:''}`],archive:['ARCHIVE · 旧档案',`<p>档案室的窗口发出微弱的蓝光。</p><div class="choices"><button class="file" data-act="record1"><span>FILE 001</span><strong>访客登记</strong>点击查看</button><button class="file" data-act="record2"><span>FILE 044</span><strong>异常记录</strong>点击查看</button></div>`],record1:['FILE 001 · 访客登记',`<p>访客：陈屿</p><p>探访对象：洛嫣</p><p class="muted">记录边缘被水浸湿，日期无法辨认。</p>${button('返回档案','archive','smallbtn')}`],record2:['FILE 044 · 异常记录',`<p>档案编号：044</p><p>监测对象姓名一栏有明显的涂改痕迹。</p><p class="muted">这一页为什么会出现在水族馆的电脑里？</p>${button('返回档案','archive','smallbtn')}`],help:['ABOUT · 制作说明',`<p>这是《芙城旧梦》的<strong>首页视觉与序章交互原型</strong>，用于确认千禧年水族馆网页风格。</p><p>已实现：渐变横幅、白色古早窗口、点击涟漪、水滴音效、手机适配、序章交互、简单档案。</p><p class="muted">场景文字为测试草稿，不代表正式剧情定稿。</p>${button('返回首页','home','smallbtn')}`]};let [title,body]=screens[stage]||screens.home;win.textContent=title;scene.innerHTML=(stage==='home'?'':`<div class="retrobar"><span class="square">✧</span><span>芙城旧梦 / MEMORY.EXE</span><span class="spacer"></span><span class="signal">● CONNECTED</span><span>2004</span></div>`)+body}function chime(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let t=audio.currentTime,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(820,t);osc.frequency.exponentialRampToValueAtTime(380,t+.17);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.045,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+.28);osc.connect(gain).connect(audio.destination);osc.start(t);osc.stop(t+.3)}catch(e){}}document.addEventListener('pointerdown',e=>{let r=document.createElement('i');r.className='ripple';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.querySelector('#ripple-layer').append(r);setTimeout(()=>r.remove(),900);chime()});document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(!el)return;let a=el.dataset.act;if(a==='unlock'){let val=document.querySelector('#pass')?.value.trim();if(val==='0440'){unlocked=true;localStorage.setItem(key+'_unlock','yes');go('archive')}else document.querySelector('#error').textContent='访问代码错误。提示：照片上的编号还缺少一位。';return}go(a)});document.querySelector('#sound').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'♫ 音效：开':'♫ 音效：关'});document.querySelector('#restart').addEventListener('click',()=>{if(confirm('重新开始序章？'))go('home')});document.querySelector('#help').addEventListener('click',()=>go('help'));render()})();
</script></body></html>
