.art.swim{background:radial-gradient(ellipse at 35% 35%,#eaf9ff 0 8%,transparent 10%),linear-gradient(135deg,#78cbd7,#0d6c91 70%)}
.art.swim:before{content:"◌  ◌  ◌";position:absolute;top:25%;left:12%;font-size:36px;color:#e8faff99}
.art.award{background:linear-gradient(140deg,#a2bbc5,#e3d7ae 45%,#557f94)}

.art.pool:before{content:"◉";position:absolute;font-size:70px;left:35%;top:8%;color:#e4f8ff99}
.art.blur{filter:blur(2px)}
.transition{position:fixed;inset:0;background:linear-gradient(180deg,#f8fdff,#b6e7f1 40%,#1c6c96);z-index:100;display:grid;place-items:center;text-align:center;color:white;overflow:hidden}
.transition:before{content:"";position:absolute;inset:-20%;background:repeating-radial-gradient(ellipse at 50% 70%,#fff0 0 25px,#ffffff2d 27px 29px,#fff0 31px 72px);animation:drift 9s linear infinite}

.transition .transition-inner{position:relative;padding:20px;text-shadow:0 2px 12px #165678}
.transition h2{font:normal clamp(30px,6vw,58px) serif;letter-spacing:5px}
.transition p{letter-spacing:2px}

.invitation .vow{font:italic 23px serif;letter-spacing:3px;margin:20px 0}
.invitation .glitch{color:#a36472;cursor:pointer;text-decoration:underline dotted}
.finalcard{background:#f6fbff;border:1px solid #a9cbdb;padding:22px;text-align:center}

.taskbar{order:2;height:43px;background:linear-gradient(180deg,#2877ed 0%,#1756d2 45%,#1344bd 55%,#246be6 100%);border:0;border-top:1px solid #5aabff;color:white;box-shadow:inset 0 1px #8cbdff;position:sticky;bottom:0;z-index:20}
.taskbar .start{background:linear-gradient(#72c84c,#3d9b2e 52%,#2e8120);border:1px solid #23731a;color:white;font-size:15px;font-style:italic;border-radius:0 13px 13px 0;padding:4px 20px;box-shadow:inset 0 1px #c8f5a8}
.taskbar button:not(.start){color:white;background:#255bca;border:1px solid #79a4fa}
.shell>.foot{display:none}
.window{border:3px solid #1755c7;border-radius:9px 9px 2px 2px;background:#ece9d8;box-shadow:3px 7px 0 #173d7b44,0 12px 28px #0005;max-width:100%}
.winbar{background:linear-gradient(#4d9cf5,#1763d8 42%,#0644bc 55%,#3477df);border-radius:5px 5px 0 0;min-height:32px;padding:3px 7px;font-family:Tahoma,'Microsoft YaHei',sans-serif}
.winbar button{border:1px solid white!important;border-radius:3px!important;background:linear-gradient(#f89a82,#d83823)!important;color:white!important;min-width:25px;min-height:23px;line-height:1}
.winbar button:first-of-type{background:linear-gradient(#a7c3e7,#427cc9)!important}
.windowcontent{background:#f7f6ed}
.menu{background:#ece9d8}
.deskicon{color:white!important;text-shadow:1px 2px 2px #001c4e,0 0 4px #001c4e!important}
.deskico{filter:drop-shadow(1px 2px 1px #0008)}
.xp-desktop-tip{margin:24px 0 0 12px;background:#fffce4e8;border:1px solid #d3c57c;padding:13px 16px;width:min(350px,90%);box-shadow:3px 4px 0 #0003;color:#20395d;font-size:13px}
.xp-desktop-tip p{margin:5px 0}.xp-desktop-tip small{color:#526881}
.xp-login{height:100dvh;display:flex;flex-direction:column;color:white;background:linear-gradient(90deg,#2455b8,#4b85e0 50%,#2455b8);font-family:Tahoma,'Microsoft YaHei',sans-serif}
.xp-login-top{height:13%;padding:18px 35px;background:#0d3d9c;border-bottom:3px solid #e7a344;font-size:12px;letter-spacing:.6px}.xp-login-top span{opacity:.7}
.xp-login-center{flex:1;display:flex;align-items:center;justify-content:center;gap:4%;padding:24px;flex-wrap:wrap}
.xp-login-brand{min-width:250px;text-align:right;padding:30px;border-right:1px solid #b3d0ff}.xp-login-brand strong{display:block;font-size:39px;letter-spacing:-2px;text-shadow:2px 3px #00318b}.xp-login-brand em{color:#ffaf39;font-size:28px}.xp-login-brand small{display:block;font-size:16px}
.xp-user{display:flex;align-items:center;gap:15px;background:linear-gradient(90deg,#ffffff22,#ffffff06);border:1px solid #d6e8ff8a;border-radius:8px;padding:16px 22px;color:white;text-align:left;min-width:290px}.xp-user:hover{background:#fff3}.xp-user-avatar{font-size:38px;background:#fff;border:3px solid #e6e6c7;border-radius:5px;padding:5px}.xp-user b,.xp-user small{display:block}.xp-user small{opacity:.8;font-size:12px}.xp-user-arrow{font-size:24px;color:#d3ffb5}
.xp-login-bottom{height:15%;background:#0d3d9c;border-top:3px solid #e7a344;display:flex;justify-content:space-between;align-items:center;padding:15px 35px;font-size:12px}.xp-login-bottom button{background:#ffffff1c;border:1px solid #fff8;color:white;padding:7px 12px}
.route-map{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;padding:28px 10px 12px;background:repeating-linear-gradient(0deg,#eaf4ed,#eaf4ed 17px,#d5e7e4 18px);border:2px solid #91b7a9;margin:10px 0 14px;overflow:hidden}
.route-water{position:absolute;top:2px;left:8px;right:8px;color:#679cbd;letter-spacing:3px;text-align:center;font-size:12px}.route-water span{letter-spacing:0}
.route-stop{z-index:1;text-align:center;border:1px solid #8aaeb1;background:#fffae6;padding:8px 2px;min-width:0;box-shadow:2px 2px #a5b8aa}.route-stop i{display:block;font-size:29px;font-style:normal;color:#39739d}.route-stop b{display:block;font-size:12px}.route-stop small{font-size:9px;display:block;color:#647e83}.route-legend{grid-column:1/-1;text-align:right;font-size:10px;color:#647c7e}
.forum-layout{grid-template-columns:minmax(0,1fr) 255px;align-items:start}.forum-sidebar{display:block!important;visibility:visible!important;border:2px solid #9aafce;background:#fffdf3;box-shadow:2px 3px #0002}.forum-side-title{font-size:16px;background:linear-gradient(#fff4ce,#e7d49b);color:#654a18}.forum-side-row.broken{background:#eee9e5;color:#675c58}
@media(max-width:740px){.forum-layout{display:flex;flex-direction:column}.forum-sidebar{order:-1;width:100%}.forum-main{width:100%}.xp-login-brand{border:0;text-align:center;padding:0}.xp-login-center{gap:10px}.route-map{grid-template-columns:repeat(2,minmax(0,1fr))}.desktop{background-attachment:scroll}}

.taskbar{order:2;height:42px;margin-top:auto;padding:3px 8px;background:linear-gradient(180deg,#3479ec 0%,#1856c5 12%,#245bd0 46%,#1044b6 89%,#164fc4 100%)!important;border:0;border-top:2px solid #5c9dff;box-shadow:inset 0 1px #85b8ff;color:#fff;text-shadow:1px 1px #10337b;gap:7px}
.taskbar .start{font:italic bold 17px Tahoma,sans-serif!important;color:white!important;background:linear-gradient(#64c45b,#278b21 48%,#197b1d 49%,#50a843)!important;border:1px solid #207224!important;border-radius:0 13px 13px 0!important;padding:3px 20px 3px 12px!important;box-shadow:inset 0 1px #b6ec9c,2px 0 5px #102e7e80}
.taskbar button:not(.start){background:linear-gradient(#6c9be8,#2465cb)!important;color:#fff!important;border:1px solid #15418c!important;box-shadow:inset 1px 1px #8bb6fa!important}
.shortcut,.deskicon{font:12px Tahoma,'SimSun',sans-serif!important;color:#fff!important;text-shadow:1px 1px 2px #00173f,1px 1px #00173f!important;min-height:75px;max-width:106px;border-radius:0!important}
.shortcut i,.deskico{font-size:31px!important;filter:drop-shadow(1px 2px 1px #111a4f88)}
.shortcut:hover,.deskicon:hover{background:#2054c577!important;border:1px dotted white!important}
.window{width:min(1100px,100%);border:3px solid #0b54d4!important;border-top:0!important;border-radius:9px 9px 3px 3px!important;background:#ece9d8!important;box-shadow:2px 5px 16px #1220478a!important;align-self:start}
.winbar{height:32px;min-height:32px!important;padding:3px 6px!important;background:linear-gradient(#58a2ff 0%,#1766e6 12%,#0050d6 45%,#0646b7 85%,#2364db)!important;font: bold 13px Tahoma,'SimSun',sans-serif!important;text-shadow:1px 1px #123b84!important;border-radius:7px 7px 0 0!important}
.winbar button{width:23px!important;height:22px!important;line-height:18px!important;color:#fff!important;font:bold 15px Tahoma!important;border:1px solid #fff!important;border-radius:4px!important;background:linear-gradient(#efb9b0,#e34835 52%,#b52118)!important;text-shadow:1px 1px #75110c!important;box-shadow:inset 1px 1px #fff7!important}
.winbar button:first-of-type{background:linear-gradient(#a2c8fa,#4b8cdb 50%,#2262b7)!important;text-shadow:1px 1px #234!important}
.menu{background:#ece9d8!important;border-bottom:1px solid #c6c1ae!important;padding:4px 10px!important;color:#202020!important}
.windowcontent{background:#fff!important;border:2px inset #d3d0c3!important;margin:4px!important;padding:13px!important;color:#222!important}
.status{background:#ece9d8!important;color:#555!important;border-top:1px solid #b5b09d!important;font:11px Tahoma,sans-serif!important}
.panel,.storycard,.cluecard{background:#fff!important;border:1px solid #9e9e9e!important;box-shadow:none!important;color:#222!important}
.paneltitle{color:#1c4481!important;border-bottom:1px solid #b4c8e1!important;font-weight:bold!important}
.hud .tag,.clue{color:#303030!important;background:#ece9d8!important;border:1px solid #bbb!important;font:11px Tahoma,sans-serif!important}
.puzzle{background:#ece9d8!important;border:2px groove #fff!important}.slot{background:#fff!important;border:2px inset #bbb!important;color:#123d86!important}
.bbs{border:1px solid #7e8a9e!important;background:#fff!important}.bbshead{background:linear-gradient(#c4d5ee,#7799c6)!important;color:#12335e!important;padding:9px 12px!important;font:bold 19px 'SimSun',serif!important;letter-spacing:1px!important;border-bottom:2px solid #4c6794!important}
.bbsnav{background:#edf1f8!important;color:#354a66!important;border-bottom:1px solid #b7c6db!important;font:12px 'SimSun',serif!important}
.forum-sidebar{background:#fff!important;border:1px solid #9da9b9!important;box-shadow:none!important}
.forum-side-title{background:linear-gradient(#dfe8f8,#b4c8e4)!important;color:#244677!important;padding:8px 10px!important;border-bottom:1px solid #8aa5c8!important;font:bold 14px 'SimSun',serif!important}
.forum-side-row{background:#fff!important;border-bottom:1px dotted #c6c6c6!important;color:#333!important;padding:10px!important}
.forum-side-row.broken{background:#eee!important;color:#777!important}

</style></head><body><div id="ripple"></div><main id="app"></main><div id="overlay"></div><script>
const STORE="fucheng_v096_progress";
const DEFAULT={page:"home",clues:[],puzzle:[],terminal:false,forum:false,album:false,invitation:false,seenTransition:[],sound:true};
let S={...DEFAULT};
try{let v=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem("fucheng_v095_progress"));if(v&&typeof v==="object")S={...S,...v}}catch(e){}
const app=document.getElementById("app"),overlay=document.getElementById("overlay");
function persist(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function add(id){if(!S.clues.includes(id)){S.clues.push(id);persist();toast("已记录线索："+id)}}
function has(id){return S.clues.includes(id)}
function toast(t){document.querySelector(".toast")?.remove();let n=document.createElement("div");n.className="toast";n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),2600)}
function audio(){if(!S.sound)return;try{const c=window.__ctx||(window.__ctx=new(window.AudioContext||window.webkitAudioContext)());c.resume();let o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type="sine";o.frequency.setValueAtTime(620,t);o.frequency.exponentialRampToValueAtTime(240,t+.23);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.065,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.31)}catch(e){}}
document.addEventListener("pointerdown",e=>{if(e.target.closest("button"))audio();let n=document.createElement("span");n.className="ring";n.style.left=e.clientX+"px";n.style.top=e.clientY+"px";document.getElementById("ripple").append(n);setTimeout(()=>n.remove(),950)});
function go(page){S.page=page;persist();overlay.innerHTML="";render();window.scrollTo(0,0)}
function closeWindow(){const parents={hospital:'home',aquarium:'hospital',terminal:'aquarium',login:'terminal',desktop:'login',forum:'desktop',album:'forum',wechat:'desktop',maintenance:'terminal',invitation:'forum',notepad:'desktop',documents:'desktop',recycle:'desktop',system:'desktop',ending:'desktop'};go(parents[S.page]||'desktop')}
function reset(){if(!confirm("重新开始会清除当前试玩进度，确定吗？"))return;S={...DEFAULT};go("hospital")}
function btn(t,fn){return `<button class="xpbtn" onclick="${fn}">${t}</button>`}
function win(t,content,status="FUCHENG · LOCAL ARCHIVE"){return `<div class="window"><div class="winbar"><span>▣</span>${t}<span class="spacer"></span><button onclick="toast('窗口已固定')" aria-label="最小化">_</button><button onclick="closeWindow()" aria-label="关闭窗口并返回上一级">×</button></div><div class="menu"><span>文件(F)</span><span>编辑(E)</span><span>查看(V)</span><span>帮助(H)</span></div><div class="windowcontent">${content}</div><div class="status"><span>${status}</span><span>● LOCAL · READY</span></div></div>`}
function login(){return `<div class="xp-login"><div class="xp-login-top">Microsoft Windows XP <span>Professional</span></div><div class="xp-login-center"><div class="xp-login-brand"><strong>Windows <em>XP</em></strong><small>欢迎使用</small></div><button class="xp-user" onclick="go('desktop')"><span class="xp-user-avatar">🐠</span><span><b>旧馆访客</b><small>点击登录工作站 044</small></span><span class="xp-user-arrow">➜</span></button></div><div class="xp-login-bottom"><span>芙城水族馆 · 工作站 044</span><button onclick="go('terminal')">返回中控入口</button></div></div>`}
function desktopIcon(icon,label,page){return `<button class="deskicon" onclick="go('${page}')"><span class="deskico">${icon}</span><span>${label}</span></button>`}
function desktop(){return shell(`<div class="xp-desktop-tip"><b>我的电脑</b><p>欢迎回来。双击图标的习惯，在这里单击即可打开。</p><small>工作站 044 · 2016</small></div>`)}
function desktopIcons(){return desktopIcon("◈","水族馆中控","terminal")+desktopIcon("☏","微信","wechat")+desktopIcon("🌐","Internet Explorer","forum")+desktopIcon("▧","图片查看器","album")+desktopIcon("▤","记事本","notepad")+desktopIcon("▣","我的文档","documents")+desktopIcon("▥","回收站","recycle")+desktopIcon("⚙","系统属性","system")}

 <div class="wx-post"><strong>陈屿</strong><p>和朋友们一起吃了冰淇淋，今天很开心！</p><time>2014.04.06</time></div>

 <div class="wx-post"><strong>陈屿</strong><p>出发前的最后一次集训。</p><time>2014.04.12</time><div style="margin-top:8px">${btn("记下这条日期","wxDiscover()")}</div></div>
 <div class="wx-alert">朋友圈和聊天记录的最后日期不一样。你想再核对一遍。</div>`;
 let code=`<div class="storycard"><h3>044 · 维护档案二级验证</h3><p>图形密钥已恢复中控系统的基本访问。这里是另一个被锁住的维护档案，不替代第一道图形谜题。</p><p>请输入你在手机里找到的四位日期。</p><input class="wx-code" id="wxDateCode" inputmode="numeric" maxlength="4" placeholder="□□□□" aria-label="四位日期密码"> ${btn("验证","wxCheck()")}<p class="tiny">日期格式：月月日日。</p></div>`;

function ending(){return shell(win("试玩章节完成",`<div class="finalcard"><div class="eyebrow">CHAPTER DEMO · COMPLETE</div><h2 style="font:normal 36px serif">你看见的，是真的吗？</h2><p>医院访客单、2016 年的系统、2004 年的童年、2014 年的荣耀……</p><p>它们可能指向同一个人，也可能只是一个被反复修改的故事。</p><p>证据还不完整，真相仍然留在水面之下。</p><p class="tiny">微信的日期矛盾已被发现。这里是试玩版结束点，不提前揭示车祸真相。</p>${btn("查看线索夹","inventory()")} ${btn("返回首页","go('home')")} ${btn("预览终章视觉（非正式剧情）","showEndingPreview()")}</div>`))}
function showEndingPreview(){overlay.innerHTML=`<div class="bsod" role="dialog" aria-label="终章视觉效果预览"><div class="bsodtext"><p>A problem has been detected and Windows has been shut down to prevent damage.</p><p>*** STOP: 0x0000007B</p><p>Beginning dump of physical memory...</p><p class="tiny">这是终章效果测试，不是正式剧情。</p></div><button class="bsodskip" onclick="closeModal()">跳过演出 ✕</button><button class="bsodnext" onclick="showRedPreview()">继续预览 →</button></div>`}
function showRedPreview(){overlay.innerHTML=`<div class="redscene" role="dialog" aria-label="红字演出预览"><div class="redwords">你还记得吗<span class="blood">。</span></div><p>终章红字文案待定 · 此处仅演示画面效果</p><button class="bsodskip" onclick="closeModal()">跳过演出 ✕</button><button class="bsodnext" onclick="showBlackPreview()">继续预览 →</button></div>`}
function showBlackPreview(){overlay.innerHTML=`<div class="blackscene" role="dialog" aria-label="黑屏独白预览"><p>我……</p><p>……</p><h2>想起来了……</h2><button class="bsodskip" onclick="closeModal()">结束预览 ✕</button></div>`}
function modal(t,content){overlay.innerHTML=`<div class="modalcover" onclick="if(event.target===this)closeModal()"><div class="modal">${win(escapeHtml(t),content)}</div></div>`;overlay.querySelector(".winbar button:last-child").onclick=closeModal}
